<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Minimalist Black Tile -->
  <rect width="100" height="100" rx="22" fill="#0A0A0A"/>
  
  <!-- "S" Geometric Arch -->
  <path d="M 64 30 C 64 22, 54 18, 42 18 C 28 18, 22 26, 22 35 C 22 47, 44 48, 56 53 C 70 59, 70 72, 66 80 C 60 88, 42 88, 28 82" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- "A" Diagonal Left Pillar -->
  <path d="M 52 18 L 32 82" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-opacity="0.85"/>
  
  <!-- "A" Diagonal Right Pillar -->
  <path d="M 52 18 L 74 82" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round"/>
  
  <!-- "A" Crossbar -->
  <path d="M 40 58 L 66 58" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.9"/>
  
  <!-- Lime-Green Apex Dot Accent -->
  <circle cx="52" cy="18" r="5" fill="#BFFF00"/>
  
  <!-- Secondary Lime-Green Terminal Indicator -->
  <circle cx="66" cy="58" r="3.5" fill="#BFFF00"/>
</svg>